name: SecureVault CloudGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: cd backend && go mod download

      - name: Check formatting
        run: cd backend && test -z "$(gofmt -l .)"

      - name: Go vet
        run: cd backend && go vet ./...

      - name: Go test
        run: cd backend && go test ./...

      - name: Build API
        run: cd backend && go build -o securevault-api ./cmd/api

      - name: OpenAPI spec present
        run: test -f backend/docs/openapi.yaml
