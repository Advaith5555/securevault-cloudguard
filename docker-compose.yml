services:
  postgres:
    image: postgres:16-alpine
    container_name: securevault-postgres
    environment:
      POSTGRES_DB: securevault_db
      POSTGRES_USER: securevault_user
      POSTGRES_PASSWORD: securevault_password
    ports:
      - "5433:5432"
    volumes:
      - securevault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevault_user -d securevault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  securevault_postgres_data:
